name: Android

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply PR 27 repair patch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/offline-queue-download-v2'
        run: |
          python3 - <<'BOOT'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/_apply_offline_queue_v2.yml').read_text()
          begin = source.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = source.index("\n          PY\n", begin)
          script = textwrap.dedent(source[begin:end])
          exec(compile(script, '<offline-queue-v2>', 'exec'))
          BOOT
          rm -f .github/workflows/_inspect_offline_queue_v2.yml
          rm -f .github/workflows/_apply_offline_queue_v2.yml
          rm -f .github/workflows/_run_offline_queue_v2.yml
          rm -f android/.offline-queue-v2-trigger
          git checkout origin/main -- .github/workflows/android.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: complete offline queue and download library repair"
            git push origin HEAD:fix/offline-queue-download-v2
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          retention-days: 14
