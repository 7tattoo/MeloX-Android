name: Temporary Playlist Transition Fix

on:
  pull_request:
    paths:
      - "android/**"

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'ci/inspect-playlist-transition'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ci/inspect-playlist-transition
          fetch-depth: 0

      - name: Fix AnimatedContent scope capture
        shell: python
        run: |
          from pathlib import Path

          path = Path('android/app/src/main/kotlin/com/lladlam/melox/ui/library/LibraryScreen.kt')
          text = path.read_text()

          old = '''        ) { targetPlaylist ->\n            if (targetPlaylist != null) {'''
          new = '''        ) { targetPlaylist ->\n            val playlistTransitionVisibilityScope = this\n            if (targetPlaylist != null) {'''
          if old not in text:
              raise SystemExit('AnimatedContent content lambda anchor not found')
          text = text.replace(old, new, 1)

          old_nested = '''                                sharedTransitionScope = sharedScope,\n                                animatedVisibilityScope = this,\n                            )'''
          new_nested = '''                                sharedTransitionScope = sharedScope,\n                                animatedVisibilityScope = playlistTransitionVisibilityScope,\n                            )'''
          if old_nested not in text:
              raise SystemExit('Nested playlist scope anchor not found')
          text = text.replace(old_nested, new_nested, 1)

          path.write_text(text)

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/kotlin/com/lladlam/melox/ui/library/LibraryScreen.kt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: preserve AnimatedContent scope for playlist transition"
          git push origin HEAD:ci/inspect-playlist-transition
