name: Run offline queue v2 patch
on:
  push:
    branches:
      - fix/offline-queue-download-v2
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/offline-queue-download-v2
      - name: Execute embedded patch
        run: |
          python3 - <<'BOOT'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/_apply_offline_queue_v2.yml').read_text()
          begin = source.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = source.index("\n          PY\n", begin)
          script = textwrap.dedent(source[begin:end])
          exec(compile(script, '<offline-queue-v2>', 'exec'))
          BOOT
      - name: Clean temporary files
        run: |
          rm -f .github/workflows/_inspect_offline_queue_v2.yml
          rm -f .github/workflows/_apply_offline_queue_v2.yml
          rm -f .github/workflows/_run_offline_queue_v2.yml
          rm -f android/.offline-queue-v2-trigger
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: complete offline queue and download library repair"
          git push origin HEAD:fix/offline-queue-download-v2
