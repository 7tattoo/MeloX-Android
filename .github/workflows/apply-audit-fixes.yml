name: Apply Android migration audit fixes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-audit-fixes.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Apply audited parity fixes
        run: |
          python3 tools/apply_audit_fixes.py
          python3 tools/fix_audit_compile.py

      - name: Check patch formatting
        run: git diff --check

      - name: Test and build debug APK
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete Android migration parity"
          git push origin HEAD:main

