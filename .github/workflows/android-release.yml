name: Android Release Source Verification

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches Android version
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#android-v}"
          actual="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)"
          test "$actual" = "$expected"

      - name: Test, lint and build release source
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon --max-workers=2 --stacktrace

      # Official APKs are signed locally with the external MeloX JKS, verified
      # with apksigner, and uploaded explicitly. This workflow intentionally
      # never publishes a debug-signed or unsigned replacement asset.
